name: CI and task snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s agent -p 'test_*.py'

  deploy-pages:
    # main への push でビルド結果を Cloudflare Pages へ反映する（公開リポジトリのため Actions は無料枠）。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name cloud-local-task-dashboard --branch main --commit-dirty=true

  refresh-cloud-snapshot:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect GitHub Actions and Cloudflare Cron
        env:
          GH_TASK_SOURCE_REPOS: ${{ vars.GH_TASK_SOURCE_REPOS }}
          GH_TASK_SOURCE_TOKEN: ${{ secrets.GH_TASK_SOURCE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent/task_collector.py --cloud-only --output public/data/tasks.json
      - name: Commit changed snapshot
        run: |
          git config user.name 'task-control-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/tasks.json
          git diff --cached --quiet || git commit -m 'chore: refresh cloud task snapshot'
          git push
      - name: Heartbeat check (zero AI tokens)
        # 15分ごとに定期タスクの停止・失敗を判定。Telegramは /api/heartbeat 側が送る（TELEGRAM_PROXY_SECRET がPagesに登録済みの場合）。
        # 未登録の間は、件数だけを書いたIssueを1本だけ開いて知らせる（タスク名は公開リポジトリに出さない）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          body=$(curl -sS -m 30 'https://cloud-local-task-dashboard.pages.dev/api/heartbeat?notify=1')
          echo "$body"
          alert=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('alert'))" 2>/dev/null)
          notified=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('notified'))" 2>/dev/null)
          counts=$(echo "$body" | python3 -c "import sys,json;c=json.load(sys.stdin)['counts'];print(f\"失敗{c['failed']}件／停止{c['stale']}件／未実行{c['overdue']}件／収集元停止{c['staleSources']}件（監視{c['watched']}件）\")" 2>/dev/null)
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "[heartbeat]"' --json number -q '.[0].number')
          if [ "$alert" = "True" ] && [ "$notified" = "no_channel" ] && [ -z "$open" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "[heartbeat] 定期タスクに停止・失敗あり" --body "$counts 詳細: https://cloud-local-task-dashboard.pages.dev/#automation"
          elif [ "$alert" = "False" ] && [ -n "$open" ]; then
            gh issue close -R "$GITHUB_REPOSITORY" "$open" --comment "復旧を確認しました。"
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: task-snapshot
          path: public/data/tasks.json
